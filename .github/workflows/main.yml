
name: Build Kade Engine Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential

      - name: Install Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"
          sdkmanager "ndk;21.4.7075529"

      - name: Download Kade Engine Android
        run: |
          git clone --depth 1 \
            https://github.com/TheLeerName/Kade-Engine-android.git \
            Kade-Engine-android

      - name: Install Haxe libraries
        working-directory: Kade-Engine-android
        run: |
          haxelib setup "$HOME/haxelib"
          haxelib install lime 7.9.0
          haxelib install openfl
          haxelib install flixel 4.11.0
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui
          haxelib install hscript
          haxelib install hxcpp

      - name: Configure Android
        working-directory: Kade-Engine-android
        run: |
          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/21.4.7075529"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"

          haxelib run lime setup
          haxelib run lime setup android -- \
            --ANDROID_SDK "$ANDROID_HOME" \
            --ANDROID_NDK_DIR "$ANDROID_NDK_HOME" \
            --JAVA_HOME "$JAVA_HOME"

          haxelib run lime config ANDROID_SETUP true

      - name: Build APK
        working-directory: Kade-Engine-android
        run: |
          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/21.4.7075529"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"

          haxelib run lime build android -final

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kade-Engine-Android-APK
          path: Kade-Engine-android/export/**/*.apk
          if-no-files-found: error
          retention-days: 7
          
